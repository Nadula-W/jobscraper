services:
  postgres:
    image: postgres:17
    container_name: internradar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: internradar
      POSTGRES_PASSWORD: internradar123
      POSTGRES_DB: internradar

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: